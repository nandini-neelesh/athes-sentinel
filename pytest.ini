[pytest]
# Tests import application modules as "backend.app.*", so collection must run
# from the repository root with the root on sys.path.
pythonpath = .
testpaths = backend/app/tests
python_files = test_*.py
filterwarnings =
    # SQLAlchemy Column(default=datetime.utcnow) triggers this on Python 3.13.
    # Tracked as a known cleanup; it does not affect stored values.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
