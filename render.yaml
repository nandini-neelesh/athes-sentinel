services:
  - type: web
    runtime: python
    name: athes-sentinel-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athes-sentinel-db
          property: connectionString
      - key: ATHES_SECRET_KEY
        generateValue: true
      - key: ATHES_ENV
        value: production
      # Set this to the deployed Vercel frontend URL after frontend deployment.
      - key: ATHES_ALLOWED_ORIGINS
        sync: false

databases:
  - name: athes-sentinel-db
    plan: free
